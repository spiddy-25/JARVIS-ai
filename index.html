<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b13">
<title>J.A.R.V.I.S. | Personal AI</title>

<style>
:root {
  --cyan: #35e7ff;
  --blue: #168bff;
  --bg: #050b13;
  --panel: rgba(13, 30, 47, .82);
  --muted: #7699ad;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 35%, #102941 0%, transparent 50%),
    var(--bg);
  color: #e6faff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 6%;
  border-bottom: 1px solid #35e7ff35;
}

.logo {
  color: var(--cyan);
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 5px;
}

.status {
  color: var(--cyan);
  font-size: 10px;
  letter-spacing: 2px;
}

main {
  width: min(100%, 850px);
  margin: auto;
  padding: 24px 18px 40px;
  text-align: center;
}

.eyebrow {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 4px;
  margin-top: 12px;
}

.reactor {
  width: 230px;
  height: 230px;
  position: relative;
  margin: 28px auto;
  display: grid;
  place-items: center;
}

.ring {
  position: absolute;
  border: 1px solid var(--cyan);
  border-radius: 50%;
  box-shadow: 0 0 18px #35e7ff30, inset 0 0 18px #35e7ff15;
}

.ring.one {
  inset: 0;
  border-right-color: transparent;
  animation: spin 8s linear infinite;
}

.ring.two {
  inset: 14px;
  border-color: var(--blue);
  border-left-color: transparent;
  animation: spin 5s linear infinite reverse;
}

.ring.three {
  inset: 29px;
  border-style: dashed;
  animation: spin 18s linear infinite;
}

.core {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  background: radial-gradient(circle, #eaffff 0%, #35e7ff 12%, #0875bc 42%, #061525 73%);
  box-shadow: 0 0 25px var(--cyan), 0 0 70px #168bff80;
  animation: pulse 2.5s ease-in-out infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  50% { transform: scale(.92); opacity: .75; }
}

h1 {
  font-size: clamp(25px, 7vw, 39px);
  letter-spacing: 5px;
  margin-bottom: 8px;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 2px;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin: 28px 0;
}

.metric {
  border: 1px solid #35e7ff30;
  background: var(--panel);
  border-radius: 8px;
  padding: 15px 5px;
}

.metric strong {
  display: block;
  color: var(--cyan);
  font-size: 12px;
  margin-bottom: 7px;
}

.metric span {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 1px;
}

.chat {
  text-align: left;
  border: 1px solid #35e7ff35;
  border-radius: 12px;
  overflow: hidden;
  background: var(--panel);
}

.chat-head {
  padding: 15px;
  color: var(--cyan);
  border-bottom: 1px solid #35e7ff25;
  font-size: 11px;
  letter-spacing: 2px;
}

#messages {
  height: 170px;
  overflow-y: auto;
  padding: 14px;
  font-size: 13px;
  line-height: 1.6;
}

.msg { margin-bottom: 12px; }
.ai { color: var(--cyan); }
.user { color: #fff; text-align: right; }

.controls {
  display: flex;
  gap: 8px;
  padding: 10px;
  border-top: 1px solid #35e7ff25;
}

input {
  min-width: 0;
  flex: 1;
  background: #06111d;
  border: 1px solid #35e7ff40;
  border-radius: 7px;
  padding: 13px 10px;
  color: white;
  outline: none;
}

button {
  border: 1px solid #35e7ff70;
  background: #0b2639;
  color: var(--cyan);
  border-radius: 7px;
  padding: 12px;
  cursor: pointer;
}

button:active { background: #174661; }

.actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0;
}

.mic {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  font-size: 22px;
}

.listening .core {
  box-shadow: 0 0 35px var(--cyan), 0 0 100px #168bff;
}

footer {
  text-align: center;
  padding: 20px;
  color: #547487;
  font-size: 9px;
  letter-spacing: 2px;
}

@media (max-width: 400px) {
  .reactor { width: 195px; height: 195px; }
  .core { width: 90px; height: 90px; }
  .logo { font-size: 18px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">J.A.R.V.I.S.</div>
  <div class="status">● SYSTEM ONLINE</div>
</header>

<main id="app">
  <div class="eyebrow">PERSONAL ARTIFICIAL INTELLIGENCE</div>

  <div class="reactor" id="reactor">
    <div class="ring one"></div>
    <div class="ring two"></div>
    <div class="ring three"></div>
    <div class="core"></div>
  </div>

  <h1>AT YOUR SERVICE</h1>
  <div class="subtitle" id="state">AWAITING YOUR COMMAND</div>

  <div class="metrics">
    <div class="metric">
      <strong>ONLINE</strong>
      <span>INTERFACE</span>
    </div>
    <div class="metric">
      <strong id="clock">--:--</strong>
      <span>LOCAL TIME</span>
    </div>
    <div class="metric">
      <strong id="voiceState">READY</strong>
      <span>VOICE SYSTEM</span>
    </div>
  </div>

  <div class="actions">
    <button class="mic" id="mic" aria-label="Start voice input">🎙</button>
    <button id="speak">🔊 Voice: ON</button>
  </div>

  <section class="chat">
    <div class="chat-head">◈ COMMAND INTERFACE</div>
    <div id="messages" aria-live="polite">
      <div class="msg ai">JARVIS: Interface initialized. AI brain connection is not configured yet.</div>
    </div>
    <form class="controls" id="form">
      <input id="input" placeholder="Enter your command..." autocomplete="off" aria-label="Your command">
      <button type="submit">SEND</button>
    </form>
  </section>
</main>

<footer>J.A.R.V.I.S. // PERSONAL SYSTEMS INTERFACE // V0.1</footer>

<script>
const $ = id => document.getElementById(id);
let voiceOn = true;

function updateClock() {
  $('clock').textContent = new Intl.DateTimeFormat([], {
    hour: '2-digit',
    minute: '2-digit'
  }).format(new Date());
}
updateClock();
setInterval(updateClock, 1000);

function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = (type === 'ai' ? 'JARVIS: ' : 'YOU: ') + text;
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function speak(text) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1;
  utterance.pitch = 1;
  window.speechSynthesis.speak(utterance);
}

function respond(text) {
  const command = text.toLowerCase().trim();
  let answer;

  if (/hello|hi jarvis|hey jarvis/.test(command)) {
    answer = 'Hello! All interface systems are ready.';
  } else if (command.includes('time')) {
    answer = 'The current time is ' + $('clock').textContent + '.';
  } else if (command.includes('your name')) {
    answer = 'I am JARVIS, your personal assistant interface.';
  } else if (command.includes('help')) {
    answer = 'Try asking for the time or saying hello. The AI brain will be connected in a later version.';
  } else if (command.includes('status')) {
    answer = 'The interface is online. Live AI services are not connected yet.';
  } else {
    answer = 'I received your command. My AI brain is not connected yet, so I cannot answer that question intelligently. That is our next development milestone.';
  }

  addMessage(answer, 'ai');
  speak(answer);
  $('state').textContent = 'AWAITING YOUR COMMAND';
  $('app').classList.remove('listening');
}

$('form').addEventListener('submit', event => {
  event.preventDefault();
  const text = $('input').value.trim();
  if (!text) return;
  addMessage(text, 'user');
  $('input').value = '';
  respond(text);
});

$('speak').addEventListener('click', () => {
  voiceOn = !voiceOn;
  $('speak').textContent = voiceOn ? '🔊 Voice: ON' : '🔇 Voice: OFF';
  if (!voiceOn && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
});

$('mic').addEventListener('click', () => {
  const Recognition = window.SpeechRecognition ||
                      window.webkitSpeechRecognition;

  if (!Recognition) {
    addMessage('Speech recognition is unavailable in this browser. Try a supported browser or type your command.', 'ai');
    return;
  }

  const recognition = new Recognition();
  recognition.lang = 'en-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  $('state').textContent = 'LISTENING...';
  $('voiceState').textContent = 'LISTENING';
  $('app').classList.add('listening');

  recognition.onresult = event => {
    const text = event.results[0][0].transcript;
    addMessage(text, 'user');
    respond(text);
  };

  recognition.onerror = () => {
    $('state').textContent = 'VOICE INPUT UNAVAILABLE';
    $('voiceState').textContent = 'READY';
    $('app').classList.remove('listening');
  };

  recognition.onend = () => {
    $('voiceState').textContent = 'READY';
    $('app').classList.remove('listening');
    if ($('state').textContent === 'LISTENING...') {
      $('state').textContent = 'AWAITING YOUR COMMAND';
    }
  };

  recognition.start();
});
</script>
</body>
</html>
